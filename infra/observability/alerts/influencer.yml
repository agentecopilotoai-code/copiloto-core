# Prometheus alerting rules — Influencer module (TASK-INFLU-018).
#
# Estas reglas se sirven junto con las demás alerts de la plataforma.
# Los métric names referenciados son los definidos en
# app/services/metrics.py — TASK-INFLU-018.

groups:
  - name: influencer
    interval: 30s
    rules:
      - alert: InfluencerProviderDown
        expr: influencer_provider_health == 0
        for: 5m
        labels:
          severity: warning
          module: influencer
        annotations:
          summary: "Influencer provider {{ $labels.provider }} ({{ $labels.modality }}) down"
          runbook_url: "https://github.com/agentecopilotoai-code/CopilotoIA/blob/main/docs/runbooks/influencer-generation-stuck.md"

      - alert: InfluencerGenerationP95High
        expr: histogram_quantile(0.95, rate(influencer_generation_duration_seconds_bucket[10m])) > 60
        for: 10m
        labels:
          severity: warning
          module: influencer
        annotations:
          summary: "Influencer generation p95 > 60s for kind={{ $labels.kind }}"
          runbook_url: "https://github.com/agentecopilotoai-code/CopilotoIA/blob/main/docs/runbooks/influencer-generation-stuck.md"

      - alert: InfluencerPublishFailures
        expr: rate(influencer_posts_published_total{status="failed"}[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          module: influencer
        annotations:
          summary: "Influencer publish failures > 0.1/s on platform {{ $labels.platform }}"
          runbook_url: "https://github.com/agentecopilotoai-code/CopilotoIA/blob/main/docs/runbooks/influencer-instagram-publish-failure.md"
