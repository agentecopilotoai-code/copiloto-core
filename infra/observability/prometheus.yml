global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  # Alertas legacy (backup-30h, verify-failed, metrics-silent).
  - /etc/prometheus/alerts.yaml
  # Alertas nuevas post audit#4 (pool DB, AI providers, backup-24h).
  # Montar `infra/observability/alerts/` → `/etc/prometheus/alerts/`.
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: copilotoia-core
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  # Cada worker corre en su propio proceso con su propio CollectorRegistry,
  # por eso necesita ser raspado por separado. Exponen /metrics en el puerto
  # WORKER_METRICS_PORT (default 9100) servido por prometheus_client.
  - job_name: copilotoia-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'event-worker:9100'
          - 'scheduler:9100'
