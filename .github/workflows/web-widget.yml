name: Web Widget — build, size check & CDN publish

on:
  push:
    branches: [main, develop]
    paths:
      - 'web-widget/**'
      - '.github/workflows/web-widget.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web-widget/**'
      - '.github/workflows/web-widget.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to s3://copilotoia-cdn/widget/v1/'
        required: false
        default: 'false'

jobs:
  build:
    name: 'Web Widget — build, lint, size, test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-widget

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-widget/node_modules
          key: ${{ runner.os }}-widget-${{ hashFiles('web-widget/package.json') }}
          restore-keys: |
            ${{ runner.os }}-widget-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Size budget (gzipped)
        run: npm run size

      - name: Tests
        run: npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-widget-dist
          path: web-widget/dist/

  publish:
    name: 'Web Widget — publish to s3://copilotoia-cdn/widget/v1/'
    needs: build
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'widget-v'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-widget-dist
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CDN_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Compute version label
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "label=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=manual-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload widget.js + widget.css (mutable)
        run: |
          aws s3 cp dist/widget.js s3://copilotoia-cdn/widget/v1/widget.js \
            --cache-control "public, max-age=300, s-maxage=300" \
            --content-type "application/javascript; charset=utf-8" \
            --content-encoding "identity"
          aws s3 cp dist/widget.css s3://copilotoia-cdn/widget/v1/widget.css \
            --cache-control "public, max-age=300, s-maxage=300" \
            --content-type "text/css; charset=utf-8"

      - name: Upload immutable alias (widget.<sha>.js)
        run: |
          aws s3 cp dist/widget.js \
            s3://copilotoia-cdn/widget/v1/widget.${{ github.sha }}.js \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript; charset=utf-8"
          aws s3 cp dist/widget.css \
            s3://copilotoia-cdn/widget/v1/widget.${{ github.sha }}.css \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css; charset=utf-8"

      - name: Invalidate CloudFront
        if: ${{ secrets.CDN_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CDN_DISTRIBUTION_ID }}" \
            --paths "/widget/v1/widget.js" "/widget/v1/widget.css"

      - name: Summary
        run: |
          echo "Published widget ${{ steps.ver.outputs.label }} to s3://copilotoia-cdn/widget/v1/" >> "$GITHUB_STEP_SUMMARY"
