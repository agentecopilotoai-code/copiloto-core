name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: "API — compile, lint & test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall app -q

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit & static tests
        run: |
          pytest tests/ -m "not requires_db and not e2e" -v --tb=short \
            --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  tests-e2e:
    # TASK-0063: journey suite against an ephemeral PostgreSQL (with pgvector,
    # btree_gist, citext). Runs the 5 patient/customer journey scenarios so
    # contract regressions (renamed columns, dropped triggers, missing tables)
    # are caught before merge. The suite is opted in via RUN_E2E=1 and the
    # schema is re-applied once per job via E2E_APPLY_SCHEMA=1.
    name: "API — journey E2E (Postgres ephemeral)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: copilotoia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_E2E: "1"
      E2E_APPLY_SCHEMA: "1"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/copilotoia_e2e"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Journey E2E tests
        run: |
          pytest tests/test_journey_e2e.py -m e2e -v --tb=short \
            --junitxml=pytest-e2e-report.xml

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-e2e-report
          path: pytest-e2e-report.xml

  admin-panel:
    name: "Admin Panel — install, lint & build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: admin-panel/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('admin-panel/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: A11y (axe smoke)
        run: npm run test:a11y

      - name: Coverage (thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-dist
          path: admin-panel/dist/

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-coverage
          path: admin-panel/coverage/
