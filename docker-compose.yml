x-app-env-files: &app-env-files
  - path: .env
    required: true
  - path: .env.auth0.local
    required: false

services:
  api:
    build: .
    env_file: *app-env-files
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app:ro
      - ./.secrets:/app/.secrets
      - knowledge-files:/app/data/knowledge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin-panel:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: .env.auth0.local
        required: false
    environment:
      ADMIN_CORE_API_BASE_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: python3 -m uvicorn app.admin.main:app --host 0.0.0.0 --port 3000
    volumes:
      - ./.secrets:/app/.secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/admin/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  event-worker:
    build: .
    env_file: *app-env-files
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 -m app.workers.event_worker
    volumes:
      - ./.secrets:/app/.secrets:ro

  scheduler:
    build: .
    env_file: *app-env-files
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 -m app.workers.scheduler

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DB_USER: ${APP_DB_USER:-copiloto_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-app-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-copilotoia-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-minio-password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"

  # ── LLM local (opcional) ─────────────────────────────────────────────────
  # Activar con: docker compose --profile llm up
  # Modelos se descargan la primera vez: docker compose --profile llm exec ollama ollama pull llama3.2:3b
  # Apunta la API a este servicio con: LOCAL_LLM_BASE_URL=http://ollama:11434
  #
  # Limitaciones de concurrencia:
  #   - Sin GPU (CPU only): ~20-60s por respuesta. Solo para desarrollo/pruebas.
  #   - Con GPU (nvidia): ~1-3s por respuesta, 1 request a la vez en cola.
  #   - Para producción con alto volumen: usar ANSWER_ENGINE=cascade + cloud LLM (TASK-0024).
  #
  # Para habilitar GPU NVIDIA agregar bajo 'ollama':
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  ollama:
    image: ollama/ollama:latest
    profiles: [llm]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  knowledge-files:
  ollama-models:
