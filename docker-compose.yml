x-app-env-files: &app-env-files
  - path: .env
    required: true
  - path: .env.auth0.local
    required: false

services:
  api:
    build: .
    env_file: *app-env-files
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    command: python3 -m uvicorn copiloto_core._runserver:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./copiloto_core:/app/copiloto_core:ro
      - ./.secrets:/app/.secrets
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin-panel:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: .env.auth0.local
        required: false
    environment:
      ADMIN_CORE_API_BASE_URL: http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"
    # M47 — `--reload` + bind mount de `./app` para que cambios en el BFF
    # (app/admin/*) se reflejen sin rebuild. Antes solo había bind de
    # `.secrets`, así que cada `docker compose restart admin-panel`
    # seguía corriendo el código congelado en la image — confuso al
    # iterar (los `print()` nuevos no aparecían en logs).
    #
    # M48 — `./admin-panel/dist:/app/app/admin/static/dist:ro` resuelve
    # la regresión que introdujo el bind anterior. En la image, Vite
    # buildea el SPA en `/web/dist` y lo copia a
    # `/app/app/admin/static/dist` (ver admin-panel/Dockerfile). Al
    # mapear `./app` completo encima, ese dist desapareció y el endpoint
    # `/admin/` devolvía 503 "React build is missing". El segundo mount
    # lo restaura desde donde Vite lo genera en el host.
    # Pre-requisito: correr `cd admin-panel && npm install && npm run build`
    # al menos una vez (lo hace `bootstrap-admin-panel.sh`).
    command: python3 -m uvicorn copiloto_core.admin.main:app --host 0.0.0.0 --port 3000 --reload
    volumes:
      # Sin `:ro` en el primer mount porque docker no puede crear un
      # sub-mount (`/app/app/admin/static/dist`) dentro de un FS
      # read-only. uvicorn no escribe en /app/app igualmente.
      - ./copiloto_core:/app/copiloto_core
      - ./admin-panel/dist:/app/copiloto_core/admin/static/dist:ro
      - ./.secrets:/app/.secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/admin/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Backup automatizado a cloud (perfil opt-in `backups`).
  # Arranca con:
  #   docker compose --profile backups up -d backup-worker
  # Variables requeridas en .env: BACKUP_S3_BUCKET, BACKUP_ENV,
  # BACKUP_GPG_RECIPIENT. La clave pública GPG debe vivir en
  # .secrets/backup_gpg_pubkey.asc; la privada (sólo nodo de verificación)
  # en .secrets/backup_gpg_privkey.asc.
  #
  # SEC-021-N (audit#4) — el mount de `/var/run/docker.sock` da control
  # *root-equivalent del host* al backup-worker. Antes era unconditional
  # (necesario para `BACKUP_VERIFY_*` que lanza un postgres efímero
  # para restaurar y verificar el backup). Ahora el default es
  # `BACKUP_VERIFY_SKIP_EPHEMERAL=1` — la verificación efímera es
  # opt-in vía `BACKUP_VERIFY_SKIP_EPHEMERAL=0`. Quien lo habilite
  # debe entender el riesgo y mover el verifier a un nodo dedicado.
  # El mount de docker.sock SIGUE presente porque docker-compose no
  # soporta volumes condicionales — pero ahora es no-op cuando la
  # verificación efímera está skip.
  backup-worker:
    build:
      context: .
      dockerfile: infra/backup-worker/Dockerfile
    profiles: ["backups"]
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      POSTGRES_HOST: postgres
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_ENV: ${BACKUP_ENV:-local}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
      BACKUP_GPG_PUBKEY_PATH: ${BACKUP_GPG_PUBKEY_PATH:-/app/.secrets/backup_gpg_pubkey.asc}
      BACKUP_SIGNER_FPR: ${BACKUP_SIGNER_FPR:-}
      BACKUP_SIGNER_PRIVKEY_PATH: ${BACKUP_SIGNER_PRIVKEY_PATH:-/app/.secrets/backup_signer_privkey.asc}
      BACKUP_SIGNER_PUBKEY_PATH: ${BACKUP_SIGNER_PUBKEY_PATH:-/app/.secrets/backup_signer_pubkey.asc}
      BACKUP_VERIFY_PG_IMAGE: ${BACKUP_VERIFY_PG_IMAGE:-pgvector/pgvector:pg16}
      BACKUP_VERIFY_PG_PORT: ${BACKUP_VERIFY_PG_PORT:-55432}
      BACKUP_VERIFY_NETWORK: ${BACKUP_VERIFY_NETWORK:-backup-verify-net}
      # SEC-021-N (audit#4): default secure (skip ephemeral verify) →
      # NO se requiere docker.sock funcional. Para activarlo en un
      # nodo dedicado: BACKUP_VERIFY_SKIP_EPHEMERAL=0 en .env.
      BACKUP_VERIFY_SKIP_EPHEMERAL: ${BACKUP_VERIFY_SKIP_EPHEMERAL:-1}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./.secrets:/app/.secrets:ro
      - ./scripts:/app/scripts:ro
      - backup-logs:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DB_USER: ${APP_DB_USER:-copiloto_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-app-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-copilotoia-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-minio-password}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"

  # Stack de observabilidad opt-in. Arranca con
  #   docker compose --profile observability up
  # OBSERVABILITY_ALLOWED_IPS debe incluir la IP del contenedor de Prometheus
  # (típicamente la subred docker, p.ej. 172.18.0.0/16) o la del host.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  backup-logs:
