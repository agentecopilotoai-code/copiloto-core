[project]
name = "copiloto-core"
version = "1.6.1"
description = "Sistema operativo multi-tenant para construir SaaS verticales sobre una base común de auth, RBAC, IA dispatch, billing, observabilidad y operaciones."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Agente Copiloto IA"}]
keywords = ["multi-tenant", "saas", "rbac", "auth0", "rls", "fastapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  # M41 — dependencias purgadas en el audit pass (0 imports en app/ tras
  # la limpieza del branch core): passlib, boto3, pypdf, python-docx,
  # aiosmtplib, python-multipart, anthropic (SDK; usamos httpx directo),
  # openai (SDK; idem), redis (solo aparece en comentario). Reducen
  # imagen + superficie de ataque (CVEs). Cuando un módulo opt-in
  # necesite alguna, la declara en su propio pyproject extras (ver
  # docs/ARCHITECTURE.md § dependencias por módulo).
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.7.1",
  # v1.2.1: usado por el CLI (`__main__._load_dotenv_into_environ`) para
  # leer .env en `bootstrap` y `migrate`. Es ya dep transitiva de
  # pydantic-settings, pero la pinneamos explícito para no romper si
  # pydantic-settings cambia su backend de .env loading.
  "python-dotenv>=1.0",
  "python-jose[cryptography]==3.3.0",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "prometheus-client==0.21.1",
  "phonenumbers==9.0.30",
  "cryptography>=44.0.0",
  # M70 (audit P0-3) — redis para session store del BFF + futuros usos
  # cross-worker (OAuth state, rate-limit distribuido). Lazy import: el
  # InMemorySessionStore sigue siendo el default cuando REDIS_URL no
  # está configurado, así que tests/single-process no requieren broker.
  "redis==5.2.1",
]

[project.optional-dependencies]
# `pytest-cov` es requerido por el job `coverage-gate` del CI
# (.github/workflows/ci.yml) que corre `pytest --cov=copiloto_core --cov-fail-under=93`.
# Sin él, pytest rechaza los flags `--cov*` con `unrecognized arguments` y
# el CI bloquea cualquier PR.
# Mantener pineado por compatibilidad determinista — bumpear junto al
# resto del tooling.
dev = [
  "pytest==8.3.4", "pytest-cov==5.0.0", "ruff==0.8.4",
  # fakeredis para test de paths Redis sin broker (audit#2 coverage gap).
  "fakeredis>=2.20.0",
]
# TASK-0072: dependencias del job `load-test` (Locust). Mantener en un extras
# aparte para que el CI normal no las instale.
load = ["locust>=2.31,<3"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["copiloto_core*"]

# Incluir SQL migrations, templates de email, assets estáticos
# como package-data (van DENTRO del wheel) — sin esto, los
# módulos consumidores no podrían acceder a las migrations del core.
[tool.setuptools.package-data]
"copiloto_core" = [
  "**/*.sql",
  "**/*.sh",
  # v1.3.0: configure-auth0.sh referencia scripts/auth0_actions/*.js
  # (custom_claims, mfa_challenge, account_linking) que se suben al
  # tenant Auth0. Sin este glob no viajarían con el wheel y el script
  # fallaría al consumer.
  "**/*.js",
  "**/*.html",
  "**/*.txt",
  "**/*.json",
  "**/*.yaml",
  "admin/static/dist/**/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "requires_db: tests that need a live PostgreSQL connection (skipped in CI with -m 'not requires_db')",
]
