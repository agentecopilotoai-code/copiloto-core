[project]
name = "copilotoia-core"
version = "0.1.0"
description = "Core multitenant event-driven para Copiloto IA"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.7.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "redis==5.2.1",
  "httpx==0.28.1",
  "boto3==1.35.90",
  "python-multipart==0.0.20",
  "structlog==24.4.0",
  "pypdf==4.3.1",
  "python-docx==1.1.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "requires_db: tests that need a live PostgreSQL connection (skipped in CI with -m 'not requires_db')",
]
